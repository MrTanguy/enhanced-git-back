version: '3.9'

networks:
  enhanced-git-network:
    external: true

services:
  db:
    image: postgres:16
    restart: always
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${BDD_USER}
      POSTGRES_PASSWORD: ${BDD_PSWD}
      POSTGRES_DB: ${BDD_NAME}
    volumes:
      - db_volume:/var/lib/postgresql/data
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${BDD_USER} -d ${BDD_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - enhanced-git-network
    logging:
      driver: loki
      options:
        loki-url: "http://localhost:3100/loki/api/v1/push"
        loki-batch-size: "400"
        loki-retries: "5"

  adminer:
    image: adminer
    restart: always
    ports:
      - "8080:8080"
    networks:
      - enhanced-git-network
    logging:
      driver: loki
      options:
        loki-url: "http://localhost:3100/loki/api/v1/push"
        loki-batch-size: "400"
        loki-retries: "5"

  api:
    restart: always
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - .:/app
      - ./certs:/app/certs
    env_file:
      - .env
    networks:
      - enhanced-git-network
    logging:
      driver: loki
      options:
        loki-url: "http://localhost:3100/loki/api/v1/push"
        loki-batch-size: "400"
        loki-retries: "5"

volumes:
  db_volume:

