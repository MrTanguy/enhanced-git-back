name: CI | Tests - Linter - Audit 

on:
  pull_request:
    branches: [ "*" ]
  workflow_dispatch:

jobs:
  CI:
    runs-on: ubuntu-latest

    env:
      ENCRYPT_TOKEN: "uYiJaK_1vUvugYMnkCiAFegSaJOKVmWpiEHsScpD_wo="
      ENCRYPT_DATA: "uYiJaK_1vUvugYMnkCiAFegSaJOKVmWpiEHsScpD_wo="
      BDD_USER: "testuser"
      BDD_PSWD: "testpass"
      BDD_HOST: "localhost"
      BDD_PORT: "3306"
      BDD_NAME: "test_db"
      APP_ENV: "test"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run dependency audit
        run: pip-audit --strict

      - name: Run linter (pylint)
        run: |
          pylint . --fail-under=10
          
      - name: Run tests (pytest)
        run: pytest --tb=short --disable-warnings
