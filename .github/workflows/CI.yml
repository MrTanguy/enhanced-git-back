name: CI - Run Tests

on:
  pull_request:
    branches: [ "*" ]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    env:
      JWT_SECRET: "fakesecret"
      REFRESH_SECRET: "fakerefresh"
      DB_USER: "testuser"
      DB_PASSWORD: "testpass"
      DB_HOST: "localhost"
      DB_PORT: "3306"
      DB_NAME: "test_db"
      APP_ENV: "test"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests with pytest
        run: pytest --tb=short --disable-warnings
