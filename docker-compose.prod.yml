version: '3.9'

services:
  db:
    image: postgres:16
    restart: always
    env_file:
      - .env.prod
    environment:
      POSTGRES_USER: ${BDD_USER}
      POSTGRES_PASSWORD: ${BDD_PSWD}
      POSTGRES_DB: ${BDD_NAME}
    volumes:
      - db_volume:/var/lib/postgresql/data
    expose:
      - "5432"

  api:
    restart: always
    build:
      context: .
      dockerfile: Dockerfile.prod
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    env_file:
      - .env.prod

volumes:
  db_volume:
