networks:
  traefik:
    external: true
  monitoring:
    external: true
  enhanced-git-preprod:
    external: true

name: enhanced-git-preprod-back
services:
  db:
    container_name: preprod-db
    image: postgres:16
    restart: always
    environment:
      POSTGRES_USER: ${BDD_USER}
      POSTGRES_PASSWORD: ${BDD_PSWD}
      POSTGRES_DB: ${BDD_NAME}
    volumes:
      - db_volume_preprod:/var/lib/postgresql/data
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${BDD_USER} -d ${BDD_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - enhanced-git-preprod
      - monitoring
    logging:
      driver: loki
      options:
        loki-url: "http://localhost:3100/loki/api/v1/push"
        loki-batch-size: "400"
        loki-retries: "5"
        loki-external-labels: "app=preprod-db"

  api:
    restart: always
    container_name: preprod-api
    build:
      context: .
      dockerfile: Dockerfile.preprod
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./:/app
    environment:
      BDD_USER: ${BDD_USER}
      BDD_PSWD: ${BDD_PSWD}
      BDD_HOST: ${BDD_HOST}
      BDD_PORT: ${BDD_PORT}
      BDD_NAME: ${BDD_NAME}
      ENCRYPT_TOKEN: ${ENCRYPT_TOKEN}
      ENCRYPT_DATA: ${ENCRYPT_DATA}
      GITHUB_CLIENT: ${GITHUB_CLIENT}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET}
      FRONT_URL: ${FRONT_URL}
      GITLAB_CLIENT: ${GITLAB_CLIENT}
      GITLAB_CLIENT_SECRET: ${GITLAB_CLIENT_SECRET}
      GITLAB_REDIRECT_URL: ${GITLAB_REDIRECT_URL}
    networks:
      - traefik
      - enhanced-git-preprod
      - monitoring
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.preprod-api.rule=Host(`apipreprod.enhanced-git.com`)"
      - "traefik.http.routers.preprod-api.entrypoints=websecure"
      - "traefik.http.routers.preprod-api.tls=true"
      - "traefik.http.routers.preprod-api.tls.certresolver=cloudflare"
      - "traefik.http.services.preprod-api.loadbalancer.server.port=8000"
      - "traefik.docker.network=traefik"

    logging:
      driver: loki
      options:
        loki-url: "http://localhost:3100/loki/api/v1/push"
        loki-batch-size: "400"
        loki-retries: "5"
        loki-external-labels: "app=preprod-api"

volumes:
  db_volume_preprod:
